<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filamentos disponibles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: storefront shelf — title + filters, then a wrapping grid of spool cards (photo, name, price, availability) */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1d2421; --muted:#5f6b66; --line:#dcdfd9;
  --accent:#e2591c; --accent-soft:#fbe6dc; --ok:#1f7a4d; --ok-soft:#dcefe3; --warn:#9a6400; --warn-soft:#f6ebcf;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2421; --ink:#e8ece9; --muted:#9aa6a0; --line:#2e3833;
  --accent:#ff7a3d; --accent-soft:#3a2216; --ok:#5fd393; --ok-soft:#183325; --warn:#f0c35c; --warn-soft:#352b12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --ink:#e8ece9; --muted:#9aa6a0; --line:#2e3833;
  --accent:#ff7a3d; --accent-soft:#3a2216; --ok:#5fd393; --ok-soft:#183325; --warn:#f0c35c; --warn-soft:#352b12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
h1{font:800 clamp(30px,6vw,52px)/1.02 var(--f-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:8px 0 0;max-width:60ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px;margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.search{flex:1 1 220px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.65;margin-left:4px;font-family:var(--f-mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{color:var(--muted);font-size:13px;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{position:relative;aspect-ratio:1/1;max-width:100%;background:#fff;border-bottom:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:contain;padding:10px}
.pill{position:absolute;top:10px;left:10px;font:600 12px var(--f-body);padding:3px 9px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.low{background:var(--warn-soft);color:var(--warn)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.kick{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.name{font:600 17px/1.25 var(--f-display);margin:0}
.meta{color:var(--muted);font-size:13px;margin:0}
.price{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price b{font:500 18px var(--f-mono);font-variant-numeric:tabular-nums}
.price span{color:var(--muted);font-size:12px}
.price .ask{font:500 14px var(--f-body);color:var(--muted)}
.empty{grid-column:1/-1;padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
footer{margin-top:28px;color:var(--muted);font-size:13px}
</style>

</head>
<body>
<div class="wrap">
  <h1>Filamentos <span>disponibles</span></h1>
  <p class="sub">Carretes de 1 kg, 1.75 mm, listos para entregar. Busca por color o material.</p>
  <div class="bar">
    <input id="q" class="search" type="search" placeholder="Buscar color, marca o material…" aria-label="Buscar">
    <select id="fMarca" aria-label="Marca"><option value="">Todas las marcas</option></select>
    <select id="fColor" aria-label="Color"><option value="">Todos los colores</option></select>
    <div class="chips" id="chips" role="group" aria-label="Material"></div>
  </div>
  <p class="count" id="count">Cargando…</p>
  <div class="grid" id="grid"><div class="empty">Cargando los filamentos disponibles…</div></div>
  <footer id="upd"></footer>
</div>

<script>
const $=s=>document.querySelector(s);
const cop=n=>'$'+Math.round(n).toLocaleString('es-CO');
let items=[],mat='Todos',q='',marca='',color='';
function fillSelect(id,vals,label){const s=$(id);const cur=s.value;s.innerHTML='';const o=document.createElement('option');o.value='';o.textContent=label;s.append(o);
  vals.forEach(v=>{const x=document.createElement('option');x.value=v;x.textContent=v;s.append(x)});s.value=vals.includes(cur)?cur:''}
function options(){
  fillSelect('#fMarca',[...new Set(items.map(p=>p.marca).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')),'Todas las marcas');
  fillSelect('#fColor',[...new Set(items.flatMap(p=>p.colores||[]))].sort((a,b)=>a.localeCompare(b,'es')),'Todos los colores');
}
$('#fMarca').addEventListener('change',e=>{marca=e.target.value;render()});
$('#fColor').addEventListener('change',e=>{color=e.target.value;render()});
function chips(){
  const c={};items.forEach(p=>c[p.material]=(c[p.material]||0)+1);
  const box=$('#chips');box.innerHTML='';
  ['Todos',...Object.keys(c).sort((a,b)=>c[b]-c[a])].forEach(m=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed',m===mat);b.textContent=m;
    const s=document.createElement('small');s.textContent=m==='Todos'?items.length:c[m];b.append(s);
    b.onclick=()=>{mat=m;chips();render()};box.append(b)});
}
function render(){
  const w=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list=items.filter(p=>(mat==='Todos'||p.material===mat)&&(!marca||p.marca===marca)&&(!color||(p.colores||[]).includes(color))&&w.every(x=>[p.marca,p.material,(p.colores||[]).join(' ')].join(' ').toLowerCase().includes(x)));
  $('#count').textContent=`${list.length} ${list.length===1?'referencia':'referencias'}`;
  const g=$('#grid');g.innerHTML='';
  if(!list.length){g.innerHTML='<div class="empty">No hay filamentos con ese filtro.</div>';return}
  const f=document.createDocumentFragment();
  list.forEach(p=>{
    const el=document.createElement('article');el.className='card';
    const low=p.stock<=2;
    el.innerHTML=`<div class="ph"><img loading="lazy" alt=""><span class="pill ${low?'low':'ok'}">${low?'Últimas unidades':'Disponible'}</span></div>
      <div class="body"><div class="kick"></div><h2 class="name"></h2><p class="meta"></p>
      <div class="price"></div></div>`;
    const src=p.img?(/^(https?:|data:)/.test(p.img)?p.img:'https://m.media-amazon.com/images/I/'+p.img+'._SL500_.jpg'):p.foto;if(src){el.querySelector('img').src=src;el.querySelector('img').referrerPolicy='no-referrer'}
    el.querySelector('img').alt=`${p.material} ${(p.colores||[]).join(' y ')}`;
    el.querySelector('.kick').textContent=p.marca;
    el.querySelector('.name').textContent=p.nombre||[p.material,(p.colores||[]).join(' + ')].filter(Boolean).join(' · ');
    el.querySelector('.meta').textContent=`Carrete 1 kg · ${p.stock} ${p.stock===1?'disponible':'disponibles'}`;
    const pr=el.querySelector('.price');
    if(p.precio){const b=document.createElement('b');b.textContent=cop(p.precio);const s=document.createElement('span');s.textContent='por kg';pr.append(b,s)}
    else{const s=document.createElement('span');s.className='ask';s.textContent='Precio a consultar';pr.append(s)}
    f.append(el)});
  g.append(f);
}
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  items=d.productos||[];options();chips();render();
  if(d.actualizado){try{$('#upd').textContent='Inventario actualizado el '+new Date(d.actualizado).toLocaleString('es-CO',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit'})}catch(e){}}
}).catch(()=>{$('#count').textContent='';$('#grid').innerHTML='<div class="empty">No se pudo cargar el catálogo. Recarga la página.</div>'});
</script>
</body>
</html>
